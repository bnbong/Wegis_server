name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run lint
        run: |
          uv run ruff check src tests
          uv run ruff format src tests --check

      - name: Run unit and API tests
        run: ENV_FILE=env.test uv run pytest tests/test_domain_checker.py tests/test_analyzer.py tests/test_api_routes.py tests/test_url_utils.py tests/test_reputation.py tests/test_net_guard.py tests/test_middleware.py tests/test_http_fetcher.py tests/test_browser_fetcher.py tests/test_auth.py tests/test_config.py tests/test_feedback.py
