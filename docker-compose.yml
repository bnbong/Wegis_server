services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: wegis_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - wegis_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-phishing_data}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: wegis_redis
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wegis_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Initialization
  redis-init:
    image: redis:7-alpine
    container_name: wegis_redis_init
    networks:
      - wegis_network
    depends_on:
      redis:
        condition: service_healthy
    # NOTE: iterate with a glob-disabled (set -f) loop over space-separated lists
    # instead of backslash line-continuations. The old `SADD ... \` continuation
    # form could leak a literal "\" member into wegis:whitelist:domains.
    command: |
      sh -c '
        set -euf
        REDIS_DB_INDEX="${REDIS_DB:-0}"
        WHITELIST_DOMAINS="google.com amazon.com microsoft.com apple.com facebook.com instagram.com twitter.com linkedin.com github.com githubusercontent.com stackoverflow.com wikipedia.org youtube.com netflix.com cnn.com bbc.com nytimes.com reddit.com openai.com naver.com daum.net kakao.com samsung.com lg.com"
        WHITELIST_PATTERNS="*.google.com *.amazon.com *.microsoft.com *.apple.com *.github.com *.githubusercontent.com *.stackoverflow.com *.wikipedia.org *.youtube.com *.naver.com *.kakao.com"

        echo "Initializing Redis whitelist (DB $REDIS_DB_INDEX)..."
        for d in $WHITELIST_DOMAINS; do
          redis-cli -h redis -p 6379 -n "$REDIS_DB_INDEX" SADD "wegis:whitelist:domains" "$d" >/dev/null
        done
        for p in $WHITELIST_PATTERNS; do
          redis-cli -h redis -p 6379 -n "$REDIS_DB_INDEX" SADD "wegis:whitelist:patterns" "$p" >/dev/null
        done

        echo "Redis initialization completed!"
        echo "Whitelist domains count: $(redis-cli -h redis -p 6379 -n "$REDIS_DB_INDEX" SCARD wegis:whitelist:domains)"
        echo "Whitelist patterns count: $(redis-cli -h redis -p 6379 -n "$REDIS_DB_INDEX" SCARD wegis:whitelist:patterns)"
      '
    restart: "no"

  # Wegis Server (for development)
  wegis-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wegis_server
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "9000:9000"
    volumes:
      - ./models:/app/models
      - ./log:/app/log
    networks:
      - wegis_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    command:
      [
        "uvicorn",
        "src.server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "9000",
        "--reload",
      ]

networks:
  wegis_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
